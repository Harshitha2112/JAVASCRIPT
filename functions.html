<html>
          <head>
                    <title>functions</title>

          </head>
          <body>
                    <script>
                              //to reuse the code we use functions//
                              function function1(){        //function keyword let us to create new functions//
                                        console.log('hello');//function body which creates funtion but doesnt run the code//
                                        console.log(2+2);
                              }
                              function1();  //calling the function



                              //using parameters//
                              function calculatetax(cost,taxpercent =0.1){ //taxpercent is set to a default value//
                                        console.log(cost*taxpercent);
                              }


                              calculatetax(5000,2);
                              calculatetax(4000);          //arguments

                    </script>
          </body>
</html>
