               when we click a button:

                    <button onclick="

                             computermove ='rock' ;   //instead of console, we assigning to variable so that we can compare computer move//

                              result ='you loose';

                              result='you win';
                    }

                    alert(      // to insert values ,we turn it into template strings by using ``//
