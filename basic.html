<html>
<head>
          <title>
                    basic javascript
          </title>
          <body>
                    <script>


                             //ternary operator//

                             const result =0 ? 'truthy':'falsy';
                             console.log(result);

                             //guard operator using and operator//
                              //if first conditon is false it dont check the nxt condition bt if it is true thn it will print the nxt one//
                             false && console.log('hello');
                             const text =5 && 'hello';
                             console.log(text);

                             //default operator using or operator//

                             const currency=undefined ||'usd';
                             console.log(currency);





                              let variable1 = 2;
                              console.log(variable1);

                              let calculation = variable1 + 2;
                              console.log(calculation);
                              console.log(calculation+2);

                              let message ='hello';
                              console.log(message);

                              variable1 =3;                //here we are re-assigning the variable1 and we r not using let keyword for re-assigning coz let will create new variable// 
                              console.log(variable1); 
                              console.log(typeof variable1);



                              const variable2= 4;           //const will not let to reassign the variable. if so it will result in error//
                              console.log(variable2);
                              variable2=3;
                              console.log(variable2);
                            
                              var variable3 =3;
                              
                    </script>

          </body>
</head>
</html>
